# protorecprep example configuration
#
# Usage:
#   protorecprep record --config etc/example.ini
#
# Every key maps to a long command-line option without the leading "--".
# Explicit command-line values override values from this file. Repeatable
# options (filter, proto_path) accumulate. Sections are for readability only.
# Relative paths resolve against the working directory.

[record]
# Bind address and output directory.
listen = 0.0.0.0:55556
out = recordings

# Protobuf schema used for JSON decoding and outbound messages.
proto = proto/sample.proto
# Additional import paths for the schema (repeatable).
# proto_path = proto/include

# Message type of inbound streams.
message_type = demo.TestRecord

# Optional include allowlist. Accepts comma-separated names and may be
# repeated; only matching message types are captured.
# filter = demo.TestRecord,demo.Nested

# Wire framing: varint-length (default) or raw.
framing = varint-length

# Write directly into "out" instead of a session subdirectory.
# flat = false

[json]
# Enable the JSONL sidecar (requires proto above).
json = true
# JSON data file. Relative names are placed inside the session directory.
json_file = events.jsonl
# Include fields with default values.
# json_print_defaults = false
# Keep protobuf field names (snake_case) instead of lowerCamelCase.
# json_preserve_names = false

[chunks]
# Duration covered by each binary capture chunk (default 1m; 0 disables it).
chunk_interval = 1m
# Optional size cap per chunk (0 = no cap).
chunk_size = 0

[io]
# max_frame = 16MiB
# recv_buffer = 256KiB
# queue_high_water = 256MiB
# overflow = block
# write_batch = 1MiB
# fsync_interval = 1s
# durable = false
# io_threads = 4
# max_connections = 1024
# idle_timeout = 0

[send]
# Optional server -> client messages (requires proto).
# send_type = demo.Nested
# send_content = {"kind":"hello","enabled":true}
# send_content_file = message.json
# send_once_after = 0ms
# send_every = 1s
# send_count = 0

[logging]
# quiet = false
# verbose = false
log_level = info
