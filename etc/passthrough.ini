# protorecprep passthrough configuration
#
# Usage:
#   protorecprep passthrough --config etc/passthrough.ini
#
# Every key maps to a long command-line option without the leading "--".
# Explicit command-line values override values from this file. Sections are
# for readability only. Relative paths resolve against the working directory.
#
# Passthrough accepts the same recording options as the record command and
# additionally forwards inbound bytes live to the configured target server.
# The target's responses are streamed back to the client and recorded as the
# outbound channel.

[passthrough]
# Local recording destination (required).
out = recordings
listen = 0.0.0.0:5000
framing = varint-length

# Optional schema for JSON output. In passthrough, message_type also types the
# response channel (target bytes are captured as the outbound direction).
# proto = proto/sample.proto
# message_type = demo.TestRecord
# json = true
# For the 8-byte typed header use framing = typed-length-le together with
# proto_package and one or more type_map entries instead of message_type.
# Raw file channels use type_map = <id>=@file.

# Live forwarding destination (required).
target = 127.0.0.1:55556

[forward]
# Per-stream backlog in bytes for both directions: inbound forwarding and
# response delivery to the client. Reads pause while a queue is full and
# resume when it drains; no bytes are dropped. (1 MiB - 1 GiB)
forward_queue = 16MiB
# Initial connection retry policy.
connect_timeout = 5s
connect_retries = 5
retry_interval = 1s
# Resume after a mid-stream connection loss. On target EOF/error with
# reconnect disabled only forwarding stops; the client and recording continue.
# reconnect = false

[recording]
# write_batch = 1MiB
# queue_high_water = 256MiB
# chunk_interval = 1m
# chunk_size = 0

[io]
# io_threads = 4

[logging]
# quiet = false
# verbose = false
log_level = info
