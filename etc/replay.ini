# protorecprep replay configuration
#
# Usage:
#   protorecprep replay --config etc/replay.ini
#
# Every key maps to a long command-line option without the leading "--".
# Explicit command-line values override values from this file. Sections are
# for readability only. Relative paths resolve against the working directory.

[replay]
# A single capture file ...
rec = recordings/session-20260101-120000-abcd1234/capture-000001.pcr
# ... or a whole session directory (all capture-*.pcr chunks, in order).
# Do not set both rec and dir.
# dir = recordings/session-20260101-120000-abcd1234

# Destination server that receives the recorded byte stream.
target = 127.0.0.1:55556

# Playback speed: 1.0 is realtime, 2.0 is twice as fast, 0 is unthrottled.
speed = 1.0

# Recorded direction to forward: in (client -> server, default), out
# (server -> client) or both.
direction = in

# Optional schema. Replay sends recorded bytes verbatim; --proto only
# validates the schema digest stored in the capture header.
# proto = proto/sample.proto
# proto_path = proto/include

[connect]
# Initial connection retry policy.
connect_timeout = 5s
connect_retries = 5
retry_interval = 1s
# Resume after a mid-stream connection loss.
# reconnect = false

[pacing]
# Cap idle gaps between records (default: preserve the original timing).
# max_gap = 1s

[validation]
# Treat damaged captures or schema mismatches as fatal.
# strict = false

[io]
# io_threads = 4

[logging]
# quiet = false
# verbose = false
log_level = info
