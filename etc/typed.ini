# protorecprep typed-framing configuration
#
# Usage:
#   protorecprep record --config etc/typed.ini
#
# The server uses an 8-byte header: u32 LE message type id, then u32 LE payload
# length (payload bytes, header excluded). Every message arrives on the same
# connection; the header selects the protobuf schema type.
#
# Type ids are deployment-specific. Only id 0 (VersionInformation) is fixed by
# the protocol; add the remaining ids manually as they become known.

[record]
listen = 0.0.0.0:55556
out = recordings

proto = proto/sample.proto
# Prefix applied to unqualified type_map names.
proto_package = demo

framing = typed-length-le

# Wire type id -> protobuf message. Repeatable. Names are resolved exactly first
# and then with proto_package as prefix; they must exist in the schema.
# Id 0 is reserved for the protocol's VersionInformation message.
type_map = 0=VersionInformation
type_map = 1=TestRecord
type_map = 2=Nested

[json]
json = true
json_file = events.jsonl

[chunks]
chunk_interval = 1m

[logging]
log_level = info
