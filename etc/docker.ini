# protorecprep container configuration
#
# Used by compose.yaml:
#   protorecprep record --config etc/docker.ini
#
# Paths are absolute inside the container. compose.yaml mounts
# ./recordings, ./proto and ./etc at /data/recordings, /data/proto and
# /data/etc respectively.

[record]
# The published container port is ${PRP_PORT:-5000}:5000.
listen = 0.0.0.0:5000
out = /data/recordings

# Protobuf schema for JSON decoding and outbound messages.
proto = /data/proto/sample.proto
message_type = demo.TestRecord

# Wire framing: varint-length (default) or typed-length-le.
# For the external 8-byte header protocol, use typed-length-le and replace
# message_type with proto_package plus type_map entries (see etc/typed.ini and
# doc/docker.md). Raw file channels use type_map = <id>=@file.
framing = varint-length

[json]
# JSONL sidecar, one file per capture chunk (capture-NNNNNN.jsonl).
# Set json_chunks = false or json_file = events.jsonl for a single file.
json = true

[chunks]
chunk_interval = 1m

[logging]
log_level = info
